allowBuilds:
  esbuild: true
# pnpm 11 waits `minimumReleaseAge` (default 1440 — a day) before it will
# resolve a newly published version, and appends every package it had to
# hold to this list on the install that hits one. Haverstack releases in
# lockstep, so a sync lands the whole scope on its release day and every
# one of them was being written back here, a version at a time.
#
# The scope pattern says once what those entries said one by one: these are
# this project's own packages, published by its own CI, and the cooldown is
# not the check that vets them. Third-party dependencies keep it.
minimumReleaseAgeExclude:
  - '@haverstack/*'
